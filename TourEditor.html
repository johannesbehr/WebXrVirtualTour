<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TourEditor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>





<div class="app-container">

    <div class="map-panel">
        <div id="mapContainer">
            <img id="mapImage" src="map2.png" alt="Karte">

            <!-- Punkte werden dynamisch eingefügt -->
            <div id="pointsLayer"></div>
        </div>
    </div>

    <div class="editor-panel">
        <h2>JSON-Daten</h2>

        <textarea id="jsonEditor">
        </textarea>
    </div>

</div>

<script src="tour-editor.js"></script>
<script type="module"> 
const tour = new URLSearchParams(window.location.search).get('tour');
let tourUrl = "./tourdata/";
if(tour!== null){
	tourUrl += tour;
}else{
	tourUrl += "default.json";
}

 const data = await fetch(tourUrl).then(r => r.json());
 const jsonEditor = document.getElementById("jsonEditor");
 updateEditor(data);
 parseEditorContent();

</script>



</body>
</html>
