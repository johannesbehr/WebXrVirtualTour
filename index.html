<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1, user-scalable=no'>
    <meta name='mobile-web-app-capable' content='yes'>
    <meta name='apple-mobile-web-app-capable' content='yes'>
    <link rel="icon" href="favicon.ico" type="image/vnd.microsoft.icon">
    <link rel='stylesheet' href='css/common.css'>

	<title>Virtueller Rundgang</title>
</head>



<body>




<header>
      <details open>
        <summary>Virtueller Rundgang</summary>
        <p>
			Ein virtueller Rundgang in VR.
          <a class="back" href="./">Back</a>
        </p>
      </details>
    </header>
	
	
<script type="module">

const viewPoint = new URLSearchParams(window.location.search).get('viewPointId');
const tour = new URLSearchParams(window.location.search).get('tour');

import { VirtualTourScene } from './js/virtual-tour/virtual-tour-scene.js';


let tourUrl = "./tourdata/";

if(tour!== null){
	tourUrl += tour;
}else{
	tourUrl += "hbs_rundgang.json";
}


let scene = await VirtualTourScene.create(tourUrl);

if (viewPoint !== null) {
  scene.loadViewPoint(viewPoint);
}


scene.initXR();
</script>

</body>
</html>
